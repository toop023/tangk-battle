<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>坦克大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#g{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#c{background:#111}
#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-around;padding:8px;background:#222;color:#fff;font-size:14px}
.btn{padding:12px 30px;font-size:16px;background:#4CAF50;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:5px}
.btn:active{background:#388E3C}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
.overlay h1{font-size:28px;margin-bottom:20px;color:#4CAF50}
.overlay h2{font-size:22px;margin-bottom:15px}
.overlay p{color:#aaa;margin-bottom:20px}
#ctrl{position:fixed;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
#ctrl>*{pointer-events:auto}
.dpad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px 60px}
.db{background:rgba(100,100,100,0.8);border:2px solid #555;border-radius:10px;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.db:active{background:rgba(150,150,150,0.9)}
.db.up{grid-column:2;grid-row:1}
.db.lt{grid-column:1;grid-row:2}
.db.rt{grid-column:3;grid-row:2}
.db.dn{grid-column:2;grid-row:3}
.ab{width:70px;height:70px;background:#f44336;border:none;border-radius:50%;color:#fff;font-size:24px;cursor:pointer}
.ab:active{background:#d32f2f;transform:scale(0.95)}
#a{position:absolute;bottom:0;left:0;right:0;height:200px;pointer-events:none}
#a>*{pointer-events:auto}
.h{display:none}
</style>
</head>
<body>
<div id="g">
<div id="ui"><span>生命:<b id="lv">3</b></span><span>关:<b id="lv2">1</b></span><span>分:<b id="sc">0</b></span></div>
<canvas id="c"></canvas>
<div id="a">
<button class="db up" id="bu">▲</button>
<button class="db lt" id="bl">◀</button>
<button class="db rt" id="br">▶</button>
<button class="db dn" id="bd">▼</button>
<button class="ab" id="bf">🔫</button>
</div>
</div>

<div class="overlay" id="m">
<h1>🎮 坦克大战</h1>
<p>消灭敌人 保护基地</p>
<button class="btn" id="st">开始游戏</button>
</div>

<div class="overlay h" id="o">
<h2 id="ot">游戏结束</h2>
<p>得分: <b id="fs">0</b></p>
<button class="btn" onclick="location.reload()">重新开始</button>
</div>

<script>
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W=14,H=12,S=32;
var gs={r:false,l:3,s:0,L:1};
var player,enemies=[],bullets=[],map=[],bombs=[],pw={s:false,v:false,d:false};
var dir={up:false,down:false,left:false,right:false};
var T={E:0,B:1,S:2,A:3};

function resize(){
  var mh=window.innerHeight-220,mw=window.innerWidth;
  var s=Math.min(mw/(W*S),mh/(H*S));
  canvas.width=W*S;canvas.height=H*S;
  canvas.style.width=(W*S*s)+'px';canvas.style.height=(H*S*s)+'px';
}

function init(){
  map=[];for(var y=0;y<H;y++){map[y]=[];for(var x=0;x<W;x++)map[y][x]=T.E}
  for(var i=0;i<25;i++){var x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-4));map[y][x]=Math.random()>0.5?T.S:T.B}
  var bx=Math.floor(W/2)-1,by=H-2;map[by][bx]=T.A;map[by][bx+1]=T.A;
  player={x:S*2,y:S*(H-2),d:'up',cd:0,inv:false,al:true,col:'#4CAF50'};
  enemies=[];for(var i=0;i<4;i++)enemies.push({x:S*(i*3+1),y:S,d:'down',cd:0,al:true,col:'#f44336'});
  bullets=[];bombs=[];pw={s:false,v:false,d:false};
  updateUI();
}

function updateUI(){
  document.getElementById('lv').textContent=gs.l;
  document.getElementById('lv2').textContent=gs.L;
  document.getElementById('sc').textContent=gs.s;
}

function drawMap(){
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var px=x*S,py=y*S;
    if(map[y][x]==T.B){ctx.fillStyle='#8B4513';ctx.fillRect(px,py,S,S);ctx.strokeStyle='#654321';ctx.strokeRect(px,py,S/2,S/2);ctx.strokeRect(px+S/2,py+S/2,S/2,S/2)}
    else if(map[y][x]==T.S){ctx.fillStyle='#708090';ctx.fillRect(px,py,S,S)}
    else if(map[y][x]==T.A){ctx.fillStyle='#FFD700';ctx.fillRect(px,py,S,S);ctx.font='24px Arial';ctx.fillText('🏰',px+2,py+26)}
  }
}

function drawTank(t){
  if(!t.al)return;
  ctx.save();
  ctx.translate(t.x+S/2,t.y+S/2);
  var ang={up:0,right:90,down:180,left:270};
  ctx.rotate(ang[t.d]*Math.PI/180);
  ctx.fillStyle=t.col;
  ctx.fillRect(-S/2+2,-S/2+2,S-4,S-4);
  ctx.fillStyle='#333';ctx.fillRect(-S/2+2,-S/2+2,6,S-4);ctx.fillRect(S/2-8,-S/2+2,6,S-4);
  ctx.fillStyle='#555';ctx.fillRect(-3,-S/2-8,6,S/2+8);
  ctx.restore();
}

function draw(){
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,canvas.width,canvas.height);
  drawMap();
  enemies.forEach(function(e){drawTank(e)});
  drawTank(player);
  bullets.forEach(function(b){
    ctx.fillStyle=b.col||'#FFD700';ctx.shadowColor=b.col||'#FFD700';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(b.x+4,b.y+4,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  });
  bombs.forEach(function(b){
    var p=b.f/15;
    ctx.globalAlpha=1-p;
    ctx.fillStyle='#ff6600';ctx.beginPath();ctx.arc(b.x,b.y,30*p,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(b.x,b.y,15*p,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
}

function update(){
  if(!gs.r)return;
  var spd=pw.v?4:3;
  if(player.al){
    if(dir.up){player.d='up';player.y-=spd}
    if(dir.down){player.d='down';player.y+=spd}
    if(dir.left){player.d='left';player.x-=spd}
    if(dir.right){player.d='right';player.x+=spd}
    if(player.x<0)player.x=0;
    if(player.x>S*(W-1))player.x=S*(W-1);
    if(player.y<S)player.y=S;
    if(player.y>S*(H-1))player.y=S*(H-1);
  }
  enemies.forEach(function(e){
    if(!e.al)return;
    if(Math.random()<0.03){var ds=['up','down','left','right'];e.d=ds[Math.floor(Math.random()*4)]}
    var mv={up:[0,-1.5],down:[0,1.5],left:[-1.5,0],right:[1.5,0]};
    e.x+=mv[e.d][0];e.y+=mv[e.d][1];
    if(e.x<0||e.x>S*(W-1)){var ds=['up','down','left','right'].filter(function(x){return x!==e.d});e.d=ds[Math.floor(Math.random()*2)]}
    if(e.y<S||e.y>S*(H-1))e.d='down';
    if(Math.random()<0.03){
      var b={x:e.x+S/2-3,y:e.y+S/2-3,d:e.d,al:true,col:null};
      bullets.push(b);
    }
  });
  bullets.forEach(function(b){
    var mv={up:[0,-6],down:[0,6],left:[-6,0],right:[6,0]};
    b.x+=mv[b.d][0];b.y+=mv[b.d][1];
    if(b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height)b.al=false;
    var tx=Math.floor(b.x/S),ty=Math.floor(b.y/S);
    if(map[ty]&&map[ty][tx]===T.B){map[ty][tx]=T.E;b.al=false}
    if(map[ty]&&map[ty][tx]===T.S)b.al=false;
    if(map[ty]&&map[ty][tx]===T.A){b.al=false;gameover(false)}
    if(b.col){enemies.forEach(function(e){
      if(e.al&&b.x>e.x&&b.x<e.x+S&&b.y>e.y&&b.y<e.y+S){
        e.al=false;b.al=false;
        bombs.push({x:e.x+S/2,y:e.y+S/2,f:0});
        gs.s+=100;updateUI();
      }
    })}
    if(!b.col&&player.al&&!player.inv&&b.x>player.x&&b.x<player.x+S&&b.y>player.y&&b.y<player.y+S){
      b.al=false;gs.l--;updateUI();
      bombs.push({x:player.x+S/2,y:player.y+S/2,f:0);
      if(gs.l<=0)gameover(false);
      else{player.x=S*2;player.y=S*(H-2);player.inv=true;setTimeout(function(){player.inv=false},2000)}
    }
  });
  bullets=bullets.filter(function(b){return b.al});
  bombs.forEach(function(b){b.f++});
  bombs=bombs.filter(function(b){return b.f<20});
  if(enemies.every(function(e){return!e.al})){
    gs.L++;init();updateUI();
  }
}

function gameLoop(){
  update();draw();
  requestAnimationFrame(gameLoop);
}

function gameover(won){
  gs.r=false;
  document.getElementById('m').classList.add('h');
  document.getElementById('o').classList.remove('h');
  document.getElementById('ot').textContent=won?'胜利!':'游戏结束';
  document.getElementById('fs').textContent=gs.s;
}

document.getElementById('st').onclick=function(){
  document.getElementById('m').classList.add('h');
  gs.r=true;gs.l=3;gs.s=0;gs.L=1;
  init();resize();gameLoop();
};

document.getElementById('bu').ontouchstart=document.getElementById('bu').onmousedown=function(e){e.preventDefault();dir.up=true};
document.getElementById('bu').ontouchend=document.getElementById('bu').onmouseup=document.getElementById('bu').onmouseleave=function(){dir.up=false};
document.getElementById('bd').ontouchstart=document.getElementById('bd').onmousedown=function(e){e.preventDefault();dir.down=true};
document.getElementById('bd').ontouchend=document.getElementById('bd').onmouseup=document.getElementById('bd').onmouseleave=function(){dir.down=false};
document.getElementById('bl').ontouchstart=document.getElementById('bl').onmousedown=function(e){e.preventDefault();dir.left=true};
document.getElementById('bl').ontouchend=document.getElementById('bl').onmouseup=document.getElementById('bl').onmouseleave=function(){dir.left=false};
document.getElementById('br').ontouchstart=document.getElementById('br').onmousedown=function(e){e.preventDefault();dir.right=true};
document.getElementById('br').ontouchend=document.getElementById('br').onmouseup=document.getElementById('br').onmouseleave=function(){dir.right=false};

document.getElementById('bf').ontouchstart=document.getElementById('bf').onmousedown=function(e){
  e.preventDefault();
  if(!player.al||!gs.r)return;
  var now=Date.now();
  if(now-player.cd<300)return;
  player.cd=now;
  var mv={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  bullets.push({x:player.x+S/2-3,y:player.y+S/2-3,d:player.d,al:true,col:'#4CAF50'});
};

document.addEventListener('keydown',function(e){
  if(e.key==='w'||e.key==='W'||e.key==='ArrowUp')dir.up=true;
  if(e.key==='s'||e.key==='S'||e.key==='ArrowDown')dir.down=true;
  if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')dir.left=true;
  if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')dir.right=true;
  if(e.key===' '&&player.al&&gs.r){
    e.preventDefault();
    var now=Date.now();
    if(now-player.cd<300)return;
    player.cd=now;
    bullets.push({x:player.x+S/2-3,y:player.y+S/2-3,d:player.d,al:true,col:'#4CAF50'});
  }
});

document.addEventListener('keyup',function(e){
  if(e.key==='w'||e.key==='W'||e.key==='ArrowUp')dir.up=false;
  if(e.key==='s'||e.key==='S'||e.key==='ArrowDown')dir.down=false;
  if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')dir.left=false;
  if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')dir.right=false;
});

window.onresize=resize;
resize();
</script>
</body>
</html>
