<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden;width:100%;height:100%}
#startBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:60px;font-size:20px;background:#4CAF50;color:#fff;border:none;border-radius:10px;z-index:10}
canvas{display:block;margin:0 auto;background:#000}
#ctrl{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px}
.dpad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px}
.btn{background:#444;border:2px solid #666;border-radius:8px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.btn:active{background:#666}
.btn.up{grid-column:2;grid-row:1}
.btn.lt{grid-column:1;grid-row:2}
.btn.rt{grid-column:3;grid-row:2}
.btn.dn{grid-column:2;grid-row:3}
#fireBtn{width:70px;height:70px;background:#f44336;border:none;border-radius:50%;color:#fff;font-size:14px}
#hud{position:fixed;top:0;left:0;right:0;padding:8px 15px;background:#222;display:flex;justify-content:space-around;font-size:14px}
#over{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:30px;border-radius:15px;text-align:center;display:none}
#over h2{font-size:24px;margin-bottom:15px}
#over p{font-size:18px;margin-bottom:20px}
</style>
</head>
<body>

<button id="startBtn" onclick="startGame()">开始游戏</button>

<div id="hud">
  <span>生命:<b id="lv">3</b></span>
  <span>关:<b id="lv2">1</b></span>
  <span>分:<b id="sc">0</b></span>
</div>

<canvas id="c"></canvas>

<div id="ctrl">
  <div class="dpad">
    <div class="btn up" id="bu">▲</div>
    <div class="btn lt" id="bl">◀</div>
    <div class="btn rt" id="br">▶</div>
    <div class="btn dn" id="bd">▼</div>
  </div>
  <button id="fireBtn" onclick="shoot()">🔫<br>发射</button>
</div>

<div id="over">
  <h2 id="msg">游戏结束</h2>
  <p>得分:<span id="fs">0</span></p>
</div>

<script>
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d');
var S = 32, W = 13, H = 10;
var playing = false;
var lives = 3, score = 0, level = 1;
var p, ens, buls, bricks;
var dir = {up:false, down:false, left:false, right:false};
var lastShoot = 0;

function resize() {
  var h = window.innerHeight - 150;
  var w = window.innerWidth;
  var scale = Math.min(w / (W*S), h / (H*S));
  cvs.width = W*S;
  cvs.height = H*S;
  cvs.style.width = (W*S*scale) + 'px';
  cvs.style.height = (H*S*scale) + 'px';
}

function startGame() {
  document.getElementById('startBtn').style.display = 'none';
  playing = true;
  lives = 3; score = 0; level = 1;
  initLevel();
  resize();
  loop();
}

function initLevel() {
  bricks = [];
  for (var i = 0; i < 10; i++) {
    var x = 2 + Math.floor(Math.random() * 9);
    var y = 3 + Math.floor(Math.random() * 4);
    bricks.push({x:x, y:y});
  }
  p = {x:S*2, y:S*7, d:'up', inv:false};
  ens = [];
  var n = Math.min(3 + level, 6);
  for (var i = 0; i < n; i++) {
    ens.push({x:S*(i*4+1), y:S, d:'down', alive:true, shootT:0});
  }
  buls = [];
  updateHUD();
}

function updateHUD() {
  document.getElementById('lv').textContent = lives;
  document.getElementById('lv2').textContent = level;
  document.getElementById('sc').textContent = score;
}

function canGo(x, y) {
  if (x < 0 || x > (W-1)*S || y < S || y > (H-1)*S) return false;
  for (var i = 0; i < bricks.length; i++) {
    var b = bricks[i];
    if (x > (b.x-1)*S && x < (b.x+1)*S && y > (b.y-1)*S && y < (b.y+1)*S) return false;
  }
  return true;
}

function shoot() {
  if (!playing) return;
  var now = Date.now();
  if (now - lastShoot < 300) return;
  lastShoot = now;
  buls.push({x:p.x+S/2-3, y:p.y+S/2-3, d:p.d, fromP:true});
}

function update() {
  if (!playing) return;
  
  // 玩家移动
  var spd = 4;
  if (dir.up && canGo(p.x, p.y-spd)) { p.d='up'; p.y -= spd; }
  if (dir.down && canGo(p.x, p.y+spd)) { p.d='down'; p.y += spd; }
  if (dir.left && canGo(p.x-spd, p.y)) { p.d='left'; p.x -= spd; }
  if (dir.right && canGo(p.x+spd, p.y)) { p.d='right'; p.x += spd; }
  
  // 敌人移动 - 直接朝玩家走
  for (var i = 0; i < ens.length; i++) {
    var e = ens[i];
    if (!e.alive) continue;
    
    var dx = p.x - e.x;
    var dy = p.y - e.y;
    
    // 每隔一段时间移动
    e.shootT++;
    
    // 移动
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && canGo(e.x+2, e.y)) { e.x += 2; e.d = 'right'; }
      else if (dx < 0 && canGo(e.x-2, e.y)) { e.x -= 2; e.d = 'left'; }
      else if (dy > 0 && canGo(e.x, e.y+2)) { e.y += 2; e.d = 'down'; }
      else if (dy < 0 && canGo(e.x, e.y-2)) { e.y -= 2; e.d = 'up'; }
    } else {
      if (dy > 0 && canGo(e.x, e.y+2)) { e.y += 2; e.d = 'down'; }
      else if (dy < 0 && canGo(e.x, e.y-2)) { e.y -= 2; e.d = 'up'; }
      else if (dx > 0 && canGo(e.x+2, e.y)) { e.x += 2; e.d = 'right'; }
      else if (dx < 0 && canGo(e.x-2, e.y)) { e.x -= 2; e.d = 'left'; }
    }
    
    // 射击
    if (e.shootT > 50 && Math.random() < 0.08) {
      e.shootT = 0;
      var sdir;
      if (Math.abs(dx) > Math.abs(dy)) sdir = dx > 0 ? 'right' : 'left';
      else sdir = dy > 0 ? 'down' : 'up';
      buls.push({x:e.x+S/2-3, y:e.y+S/2-3, d:sdir, fromP:false});
    }
  }
  
  // 子弹
  for (var i = buls.length-1; i >= 0; i--) {
    var b = buls[i];
    var spd = 8;
    if (b.d === 'up') b.y -= spd;
    if (b.d === 'down') b.y += spd;
    if (b.d === 'left') b.x -= spd;
    if (b.d === 'right') b.x += spd;
    
    // 边界
    if (b.x < 0 || b.x > W*S || b.y < 0 || b.y > H*S) {
      buls.splice(i, 1);
      continue;
    }
    
    // 砖块碰撞
    var bx = Math.floor(b.x / S);
    var by = Math.floor(b.y / S);
    for (var j = bricks.length-1; j >= 0; j--) {
      if (bricks[j].x === bx && bricks[j].y === by) {
        bricks.splice(j, 1);
        buls.splice(i, 1);
        break;
      }
    }
    if (!buls[i]) continue;
    
    // 子弹碰撞
    if (b.fromP) {
      // 打敌人
      for (var j = 0; j < ens.length; j++) {
        var e = ens[j];
        if (e.alive && Math.abs(b.x - e.x) < S && Math.abs(b.y - e.y) < S) {
          e.alive = false;
          buls.splice(i, 1);
          score += 100;
          updateHUD();
          break;
        }
      }
    } else {
      // 打玩家
      if (!p.inv && Math.abs(b.x - p.x) < S && Math.abs(b.y - p.y) < S) {
        buls.splice(i, 1);
        lives--;
        updateHUD();
        if (lives <= 0) {
          playing = false;
          document.getElementById('over').style.display = 'block';
          document.getElementById('fs').textContent = score;
        } else {
          p.x = S*2; p.y = S*7;
          p.inv = true;
          setTimeout(function(){p.inv=false}, 2000);
        }
      }
    }
  }
  
  // 过关
  if (ens.every(function(e){return !e.alive})) {
    level++;
    initLevel();
  }
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  
  // 基地
  ctx.fillStyle = '#FFD700';
  ctx.fillRect((W/2-1)*S, (H-2)*S, S*2, S);
  ctx.font = '24px Arial';
  ctx.fillText('🏰', (W/2-1)*S+2, (H-1)*S-2);
  
  // 砖块
  ctx.fillStyle = '#8B4513';
  for (var i = 0; i < bricks.length; i++) {
    ctx.fillRect(bricks[i].x*S, bricks[i].y*S, S, S);
  }
  
  // 敌人
  ctx.fillStyle = '#f44336';
  for (var i = 0; i < ens.length; i++) {
    var e = ens[i];
    if (!e.alive) continue;
    drawTank(e.x, e.y, e.d, '#f44336');
  }
  
  // 玩家
  if (!p.inv || Math.floor(Date.now()/100)%2===0) {
    drawTank(p.x, p.y, p.d, '#4CAF50');
  }
  
  // 子弹
  for (var i = 0; i < buls.length; i++) {
    var b = buls[i];
    ctx.fillStyle = b.fromP ? '#FFD700' : '#ff5252';
    ctx.beginPath();
    ctx.arc(b.x+3, b.y+3, 4, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawTank(x, y, d, col) {
  ctx.save();
  ctx.translate(x+S/2, y+S/2);
  var ang = {up:0, right:90, down:180, left:270};
  ctx.rotate(ang[d]*Math.PI/180);
  ctx.fillStyle = col;
  ctx.fillRect(-S/2+2, -S/2+2, S-4, S-4);
  ctx.fillStyle = '#333';
  ctx.fillRect(-S/2+2, -S/2+2, 6, S-4);
  ctx.fillRect(S/2-8, -S/2+2, 6, S-4);
  ctx.fillRect(-3, -S/2-8, 6, 10);
  ctx.restore();
}

function loop() {
  update();
  draw();
  if (playing) requestAnimationFrame(loop);
}

// 方向键
document.getElementById('bu').ontouchstart = function(e){e.preventDefault();dir.up=true};
document.getElementById('bu').ontouchend = function(e){e.preventDefault();dir.up=false};
document.getElementById('bu').onmousedown = function(){dir.up=true};
document.getElementById('bu').onmouseup = function(){dir.up=false};

document.getElementById('bd').ontouchstart = function(e){e.preventDefault();dir.down=true};
document.getElementById('bd').ontouchend = function(e){e.preventDefault();dir.down=false};
document.getElementById('bd').onmousedown = function(){dir.down=true};
document.getElementById('bd').onmouseup = function(){dir.down=false};

document.getElementById('bl').ontouchstart = function(e){e.preventDefault();dir.left=true};
document.getElementById('bl').ontouchend = function(e){e.preventDefault();dir.left=false};
document.getElementById('bl').onmousedown = function(){dir.left=true};
document.getElementById('bl').onmouseup = function(){dir.left=false};

document.getElementById('br').ontouchstart = function(e){e.preventDefault();dir.right=true};
document.getElementById('br').ontouchend = function(e){e.preventDefault();dir.right=false};
document.getElementById('br').onmousedown = function(){dir.right=true};
document.getElementById('br').onmouseup = function(){dir.right=false};

// 键盘
document.onkeydown = function(e) {
  if (e.key==='ArrowUp'||e.key==='w') dir.up=true;
  if (e.key==='ArrowDown'||e.key==='s') dir.down=true;
  if (e.key==='ArrowLeft'||e.key==='a') dir.left=true;
  if (e.key==='ArrowRight'||e.key==='d') dir.right=true;
  if (e.key===' ') {e.preventDefault(); shoot();}
};
document.onkeyup = function(e) {
  if (e.key==='ArrowUp'||e.key==='w') dir.up=false;
  if (e.key==='ArrowDown'||e.key==='s') dir.down=false;
  if (e.key==='ArrowLeft'||e.key==='a') dir.left=false;
  if (e.key==='ArrowRight'||e.key==='d') dir.right=false;
};

window.onresize = resize;
resize();
</script>
</body>
</html>
